name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t devops-health-check:0.1.0 .

      # CI only builds and validates — it never deploys to any cluster.
      - name: Validate k8s manifests (kubeconform)
        id: kubeconform
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          /tmp/kubeconform -strict -ignore-missing-schemas k8s/*.yaml

      # Fallback so a flaky kubeconform download never hard-fails CI;
      # the manifests themselves must still parse or this step fails.
      - name: Validate k8s manifests (python-yaml fallback)
        if: steps.kubeconform.outcome == 'failure'
        run: |
          pip install pyyaml
          python -c "import glob, yaml; docs = [(f, list(yaml.safe_load_all(open(f)))) for f in sorted(glob.glob('k8s/*.yaml'))]; assert all(d for _, d in docs), 'empty/invalid YAML document'; print('k8s YAML OK:', ', '.join(f'{f} ({len(d)} doc)' for f, d in docs))"
